name: Validate Meta-Knowledge Lexicon

on:
  push:
    branches: [ main, master ]
    paths:
      - 'references/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'references/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Lexicon Format & Schema Validator
        run: python scripts/validate_lexicon.py --validate
