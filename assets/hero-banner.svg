<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1218"/>
      <stop offset="100%" stop-color="#18121E"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D2322"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="engineCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#374151" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Header Title -->
  <text x="600" y="52" text-anchor="middle" fill="#F9FAFB" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="800" letter-spacing="1">
    🔑 Meta-Knowledge Prompt Translator · 元知识与专业词提示词破译器
  </text>
  <text x="600" y="82" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14">
    破除“自然表达派”迷思：从日常大白话痛点 → 逆向匹配行业隐性共识与高信息密度“专业词钥匙” → 唤醒大模型底层专家能力
  </text>

  <!-- Left Card: Colloquial Input (Pain Points) -->
  <g transform="translate(45, 115)">
    <rect width="310" height="265" rx="14" fill="url(#redCard)" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.45"/>
    <rect x="18" y="18" width="190" height="28" rx="6" fill="#7F1D1D" fill-opacity="0.6"/>
    <text x="28" y="37" fill="#FCA5A5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">
      ❌ 自然表达派（大白话直出）
    </text>

    <g transform="translate(18, 62)" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#E5E7EB">
      <rect x="0" y="0" width="274" height="40" rx="8" fill="#1F2937" fill-opacity="0.7" stroke="#374151" stroke-width="1"/>
      <text x="12" y="24">🗣️ “做个视频工具网页，功能要全！”</text>

      <rect x="0" y="48" width="274" height="40" rx="8" fill="#1F2937" fill-opacity="0.7" stroke="#374151" stroke-width="1"/>
      <text x="12" y="72">🗣️ “帮我写份给老板看的10页PPT”</text>

      <rect x="0" y="96" width="274" height="40" rx="8" fill="#1F2937" fill-opacity="0.7" stroke="#374151" stroke-width="1"/>
      <text x="12" y="120">🗣️ “给了历史数据，算算哪支球队赢”</text>

      <rect x="0" y="144" width="274" height="44" rx="8" fill="#450A0A" fill-opacity="0.6" stroke="#DC2626" stroke-width="1" stroke-dasharray="4 2"/>
      <text x="12" y="164" fill="#FCA5A5" font-weight="700">⚠️ 结果：58个按钮堆首屏 / 流水账无重点</text>
      <text x="12" y="181" fill="#F87171" font-size="11.5">缺乏领域触发词，AI 只能按最平庸均值输出</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(365, 232)">
    <line x1="0" y1="15" x2="52" y2="15" stroke="#F59E0B" stroke-width="3" stroke-dasharray="5 3"/>
    <polygon points="50,7 66,15 50,23" fill="#F59E0B"/>
    <text x="33" y="0" text-anchor="middle" fill="#FBBF24" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700">逆向诊断</text>
  </g>

  <!-- Center Card: Meta-Knowledge Engine -->
  <g transform="translate(440, 110)">
    <rect width="320" height="275" rx="16" fill="url(#engineCard)" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="20" y="16" width="280" height="32" rx="8" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="1"/>
    <text x="160" y="37" text-anchor="middle" fill="#FDE68A" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="800">
      ⚙️ 四步元知识破译引擎 (34+ Keys)
    </text>

    <g transform="translate(20, 62)" font-family="system-ui, 'Microsoft YaHei', sans-serif">
      <rect x="0" y="0" width="280" height="42" rx="8" fill="#111827" fill-opacity="0.85" stroke="#4F46E5" stroke-width="1"/>
      <text x="12" y="18" fill="#A5B4FC" font-size="12" font-weight="700">Step 1 · 剥离口语表象，锚定细分学科</text>
      <text x="12" y="34" fill="#9CA3AF" font-size="11">UI交互 / 眼动视觉 / 商业咨询 / 统计学 / 软件工程</text>

      <rect x="0" y="50" width="280" height="48" rx="8" fill="#111827" fill-opacity="0.85" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="12" y="68" fill="#FCD34D" font-size="12" font-weight="700">Step 2 · 激活“专业词钥匙” &amp; 宗师溯源</text>
      <text x="12" y="86" fill="#E5E7EB" font-size="11">渐进式披露 · 金字塔原理 · 蒙特卡洛 · 消融实验 · 剪影</text>

      <rect x="0" y="106" width="280" height="42" rx="8" fill="#111827" fill-opacity="0.85" stroke="#4F46E5" stroke-width="1"/>
      <text x="12" y="124" fill="#A5B4FC" font-size="12" font-weight="700">Step 3 · 正交多钥匙组合 &amp; 自我消融护栏</text>
      <text x="12" y="140" fill="#9CA3AF" font-size="11">最多组合 3 把正交钥匙，展开为可执行硬约束</text>

      <rect x="0" y="156" width="280" height="42" rx="8" fill="#111827" fill-opacity="0.85" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="174" fill="#6EE7B7" font-size="12" font-weight="700">Step 4 · 三模态自适应交付</text>
      <text x="12" y="190" fill="#9CA3AF" font-size="11">⚡静默干活模式 | 🚀Prompt编译器 | 🧭苏格拉底诊断</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(770, 232)">
    <line x1="0" y1="15" x2="52" y2="15" stroke="#10B981" stroke-width="3" stroke-dasharray="5 3"/>
    <polygon points="50,7 66,15 50,23" fill="#10B981"/>
    <text x="33" y="0" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700">高维唤醒</text>
  </g>

  <!-- Right Card: Master-Level Output -->
  <g transform="translate(845, 115)">
    <rect width="310" height="265" rx="14" fill="url(#greenCard)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.55"/>
    <rect x="18" y="18" width="215" height="28" rx="6" fill="#064E3B" fill-opacity="0.7"/>
    <text x="28" y="37" fill="#6EE7B7" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">
      ✅ 元知识赋能（工业级高水准产出）
    </text>

    <g transform="translate(18, 62)" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E5E7EB">
      <rect x="0" y="0" width="274" height="40" rx="8" fill="#1F2937" fill-opacity="0.75" stroke="#059669" stroke-width="1"/>
      <text x="12" y="18" fill="#34D399" font-weight="700">🔑 渐进式披露 (Progressive Disclosure)</text>
      <text x="12" y="33" fill="#D1D5DB" font-size="11">首屏从 58 个元素骤降至 16 个 (-69%)，清爽聚焦</text>

      <rect x="0" y="48" width="274" height="40" rx="8" fill="#1F2937" fill-opacity="0.75" stroke="#059669" stroke-width="1"/>
      <text x="12" y="66" fill="#34D399" font-weight="700">🔑 金字塔原理 + SCQA + MECE</text>
      <text x="12" y="81" fill="#D1D5DB" font-size="11">前2页直接亮出核心结论，观点型标题层层排证</text>

      <rect x="0" y="96" width="274" height="40" rx="8" fill="#1F2937" fill-opacity="0.75" stroke="#059669" stroke-width="1"/>
      <text x="12" y="114" fill="#34D399" font-weight="700">🔑 蒙特卡洛模拟 (10,000+ 随机仿真)</text>
      <text x="12" y="129" fill="#D1D5DB" font-size="11">告别正确的废话，输出量化胜率分布与敏感变量</text>

      <rect x="0" y="144" width="274" height="44" rx="8" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="1"/>
      <text x="12" y="164" fill="#A7F3D0" font-weight="700">🚀 生产力放大数倍：知其然，更握其钥匙</text>
      <text x="12" y="181" fill="#6EE7B7" font-size="11">支持 Antigravity / Claude Code / Cursor / 网页端 AI</text>
    </g>
  </g>
</svg>
