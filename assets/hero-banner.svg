<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241218"/>
      <stop offset="100%" stop-color="#18121E"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D2322"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="engineCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Top Badge: Vibe Coding Ready -->
  <g transform="translate(600, 32)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">
      ⚡ 专为 VIBE CODING &amp; 复杂工程实做打造
    </text>
  </g>

  <!-- Header Title -->
  <text x="600" y="78" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="800" letter-spacing="0.5">
    🔑 plain-to-meta · 元知识钥匙与专家实做引擎
  </text>
  <text x="600" y="106" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13.5">
    告别“高端大气”大白话与“你是XX专家”假人设：从日常痛点直达 70+ 种顶级界面设计美学与跨界架构元知识
  </text>

  <!-- Left Card: Colloquial Input (Pain Points) -->
  <g transform="translate(45, 130)">
    <rect width="310" height="280" rx="14" fill="url(#redCard)" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.45"/>
    <rect x="18" y="16" width="200" height="28" rx="6" fill="#7F1D1D" fill-opacity="0.6"/>
    <text x="28" y="35" fill="#FCA5A5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">
      ❌ 大白话直出 / 假扮演专家
    </text>

    <g transform="translate(18, 56)" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E5E7EB">
      <rect x="0" y="0" width="274" height="38" rx="7" fill="#1F2937" fill-opacity="0.7" stroke="#374151" stroke-width="1"/>
      <text x="10" y="23">🗣️ “写个AI工具主页，要高级、炫酷！”</text>

      <rect x="0" y="44" width="274" height="38" rx="7" fill="#1F2937" fill-opacity="0.7" stroke="#374151" stroke-width="1"/>
      <text x="10" y="67">🗣️ “你是20年顶级顾问，做份10页PPT”</text>

      <rect x="0" y="88" width="274" height="38" rx="7" fill="#1F2937" fill-opacity="0.7" stroke="#374151" stroke-width="1"/>
      <text x="10" y="111">🗣️ “代码老报错，功能很多不知道怎么排”</text>

      <rect x="0" y="132" width="274" height="78" rx="8" fill="#450A0A" fill-opacity="0.6" stroke="#DC2626" stroke-width="1" stroke-dasharray="4 2"/>
      <text x="10" y="152" fill="#FCA5A5" font-weight="700">⚠️ 结果：审美死刑 + 方案空泛</text>
      <text x="10" y="172" fill="#F87171" font-size="11">· 俗气紫蓝渐变 / 58个混乱按钮堆首屏</text>
      <text x="10" y="190" fill="#F87171" font-size="11">· 换了黑话腔调，步骤一点没改，无状态机</text>
      <text x="10" y="202" fill="#F87171" font-size="10"></text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(365, 256)">
    <line x1="0" y1="15" x2="52" y2="15" stroke="#F59E0B" stroke-width="3" stroke-dasharray="5 3"/>
    <polygon points="50,7 66,15 50,23" fill="#F59E0B"/>
    <text x="33" y="0" text-anchor="middle" fill="#FBBF24" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700">逆向匹配</text>
  </g>

  <!-- Center Card: Dual-Core Engine -->
  <g transform="translate(440, 125)">
    <rect width="320" height="290" rx="16" fill="url(#engineCard)" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="20" y="16" width="280" height="32" rx="8" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="1"/>
    <text x="160" y="37" text-anchor="middle" fill="#FDE68A" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="800">
      ⚙️ 双核引擎 · 定向借力实做与资产化
    </text>

    <g transform="translate(20, 58)" font-family="system-ui, 'Microsoft YaHei', sans-serif">
      <rect x="0" y="0" width="280" height="48" rx="8" fill="#111827" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1"/>
      <text x="10" y="18" fill="#7DD3FC" font-size="11.5" font-weight="700">一、定向 (Orient)：交底目的排查遗漏</text>
      <text x="10" y="36" fill="#94A3B8" font-size="10.5">先查缺漏前置条件，不锁死残缺表面动作</text>

      <rect x="0" y="54" width="280" height="52" rx="8" fill="#111827" fill-opacity="0.85" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="10" y="72" fill="#FCD34D" font-size="11.5" font-weight="700">二、借力 (Borrow)：70+ 把跨界专业钥匙</text>
      <text x="10" y="90" fill="#E5E7EB" font-size="10.5">便当格 · 新粗野 · 终端极客 · 渐进披露 · 金字塔</text>
      <text x="10" y="102" fill="#A5B4FC" font-size="9.5">✨ 每把钥匙配一句话人话锚点，直接做进结果</text>

      <rect x="0" y="112" width="280" height="48" rx="8" fill="#111827" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1"/>
      <text x="10" y="130" fill="#7DD3FC" font-size="11.5" font-weight="700">三、深挖 (Ground &amp; Falsify)：一手穿透与证伪</text>
      <text x="10" y="148" fill="#94A3B8" font-size="10.5">找推翻当前判断的反面证据 + 认知诚实清单</text>

      <rect x="0" y="166" width="280" height="52" rx="8" fill="#111827" fill-opacity="0.85" stroke="#10B981" stroke-width="1.2"/>
      <text x="10" y="184" fill="#6EE7B7" font-size="11.5" font-weight="700">🧭 决策树前沿追问 (Frontier Grilling)</text>
      <text x="10" y="202" fill="#CBD5E1" font-size="10.5">查事实归 AI、拍板归用户；每题必附“回‘是’采纳”</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(770, 256)">
    <line x1="0" y1="15" x2="52" y2="15" stroke="#10B981" stroke-width="3" stroke-dasharray="5 3"/>
    <polygon points="50,7 66,15 50,23" fill="#10B981"/>
    <text x="33" y="0" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700">专家交付</text>
  </g>

  <!-- Right Card: Professional Outcome -->
  <g transform="translate(845, 130)">
    <rect width="310" height="280" rx="14" fill="url(#greenCard)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.45"/>
    <rect x="18" y="16" width="210" height="28" rx="6" fill="#064E3B" fill-opacity="0.6"/>
    <text x="28" y="35" fill="#6EE7B7" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">
      ✅ 专家级生产力实做成果
    </text>

    <g transform="translate(18, 56)" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E5E7EB">
      <rect x="0" y="0" width="274" height="48" rx="7" fill="#1F2937" fill-opacity="0.7" stroke="#10B981" stroke-width="1"/>
      <text x="10" y="20" fill="#A7F3D0" font-weight="700">🎨 Vibe Coding 顶级设计风格</text>
      <text x="10" y="38" fill="#94A3B8" font-size="11">Bento Grid 4轨布局 / 纯黑硬边框 / 终端CLI</text>

      <rect x="0" y="54" width="274" height="48" rx="7" fill="#1F2937" fill-opacity="0.7" stroke="#10B981" stroke-width="1"/>
      <text x="10" y="74" fill="#A7F3D0" font-weight="700">🏗️ 工业级系统架构与健壮性</text>
      <text x="10" y="92" fill="#94A3B8" font-size="11">有限状态机 FSM / 渐进披露 / 乐观UI / 功能开关</text>

      <rect x="0" y="108" width="274" height="48" rx="7" fill="#1F2937" fill-opacity="0.7" stroke="#10B981" stroke-width="1"/>
      <text x="10" y="128" fill="#A7F3D0" font-weight="700">📊 咨询级汇报与可解释性</text>
      <text x="10" y="146" fill="#94A3B8" font-size="11">金字塔 Action Title / 蒙特卡洛 10k 模拟</text>

      <rect x="0" y="162" width="274" height="48" rx="7" fill="#064E3B" fill-opacity="0.5" stroke="#059669" stroke-width="1"/>
      <text x="10" y="182" fill="#6EE7B7" font-weight="700">🚀 资产化提示词：三轨分流 + {{变量}}</text>
      <text x="10" y="200" fill="#34D399" font-size="11">直接用于 Cursor, v0, Claude, Midjourney</text>
    </g>
  </g>
</svg>
