    <text x="267" y="370" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">
      😱 痛点：像飞机仪表盘一样压抑，新用户不知道第一步点哪，学习成本极高
    </text>
  </g>

  <!-- RIGHT: AFTER (Progressive Disclosure + Swiss Grid) -->
