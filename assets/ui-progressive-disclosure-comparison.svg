<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="17" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="800">
    📊 真实视觉对比 01：Vibe Coding 软件界面 —— 大白话堆砌 vs. 【渐进式披露 (Progressive Disclosure)】
  </text>
  <text x="600" y="68" text-anchor="middle" fill="#94A3B8" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="13.5">
    需求：“帮我写一个 AI 短视频生成工作台网页” —— 一把专业词钥匙直接砍掉 69% 首屏认知噪音
  </text>

  <!-- LEFT: BEFORE (58 Controls Cluttered) -->
  <g transform="translate(40, 90)">
    <rect width="535" height="395" rx="12" fill="#18181B" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Window Bar -->
    <rect width="535" height="36" rx="12" fill="#27272A"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="275" y="23" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">
      ❌ Before：自然表达派（首屏密密麻麻堆砌 58 个控件）
    </text>

    <!-- Dense chaotic grid of tiny controls -->
    <g transform="translate(16, 48)" fill="#27272A" stroke="#52525B" stroke-width="1" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="9.5">
      <!-- Row 1: 6 tiny boxes -->
      <rect x="0" y="0" width="80" height="28" rx="4"/><text x="8" y="18" fill="#A1A1AA" stroke="none">采样率 44.1kHz</text>
      <rect x="85" y="0" width="80" height="28" rx="4"/><text x="93" y="18" fill="#A1A1AA" stroke="none">比特率 320k</text>
      <rect x="170" y="0" width="80" height="28" rx="4"/><text x="178" y="18" fill="#A1A1AA" stroke="none">编码 H.264</text>
      <rect x="255" y="0" width="80" height="28" rx="4"/><text x="263" y="18" fill="#A1A1AA" stroke="none">色彩空间</text>
      <rect x="340" y="0" width="80" height="28" rx="4"/><text x="348" y="18" fill="#A1A1AA" stroke="none">关键帧间隔</text>
      <rect x="425" y="0" width="78" height="28" rx="4"/><text x="433" y="18" fill="#A1A1AA" stroke="none">GOP 大小</text>

      <!-- Row 2: 6 tiny boxes -->
      <rect x="0" y="34" width="80" height="28" rx="4"/><text x="8" y="52" fill="#A1A1AA" stroke="none">字幕边距 X</text>
      <rect x="85" y="34" width="80" height="28" rx="4"/><text x="93" y="52" fill="#A1A1AA" stroke="none">字幕边距 Y</text>
      <rect x="170" y="34" width="80" height="28" rx="4"/><text x="178" y="52" fill="#A1A1AA" stroke="none">描边粗细 2px</text>
      <rect x="255" y="34" width="80" height="28" rx="4"/><text x="263" y="52" fill="#A1A1AA" stroke="none">阴影偏移</text>
      <rect x="340" y="34" width="80" height="28" rx="4"/><text x="348" y="52" fill="#A1A1AA" stroke="none">阴影模糊度</text>
      <rect x="425" y="34" width="78" height="28" rx="4"/><text x="433" y="52" fill="#A1A1AA" stroke="none">字间距调整</text>

      <!-- Row 3: 6 tiny boxes -->
      <rect x="0" y="68" width="80" height="28" rx="4"/><text x="8" y="86" fill="#A1A1AA" stroke="none">语速 1.05x</text>
      <rect x="85" y="68" width="80" height="28" rx="4"/><text x="93" y="86" fill="#A1A1AA" stroke="none">音高 Pitch</text>
      <rect x="170" y="68" width="80" height="28" rx="4"/><text x="178" y="86" fill="#A1A1AA" stroke="none">停顿静音阈值</text>
      <rect x="255" y="68" width="80" height="28" rx="4"/><text x="263" y="86" fill="#A1A1AA" stroke="none">降噪强度</text>
      <rect x="340" y="68" width="80" height="28" rx="4"/><text x="348" y="86" fill="#A1A1AA" stroke="none">混响干湿比</text>
      <rect x="425" y="68" width="78" height="28" rx="4"/><text x="433" y="86" fill="#A1A1AA" stroke="none">均衡器 EQ</text>

      <!-- Row 4: Cramped prompt + random toggles -->
      <rect x="0" y="102" width="250" height="58" rx="4"/><text x="10" y="125" fill="#D4D4D8" stroke="none">在此输入脚本内容（被淹没在参数海洋里）...</text>
      <rect x="255" y="102" width="120" height="26" rx="4"/><text x="263" y="119" fill="#A1A1AA" stroke="none">[x] 启用运动模糊</text>
      <rect x="380" y="102" width="123" height="26" rx="4"/><text x="388" y="119" fill="#A1A1AA" stroke="none">[ ] 强制光流补帧</text>
      <rect x="255" y="134" width="120" height="26" rx="4"/><text x="263" y="151" fill="#A1A1AA" stroke="none">[x] 水印透明度 45%</text>
      <rect x="380" y="134" width="123" height="26" rx="4"/><text x="388" y="151" fill="#A1A1AA" stroke="none">[ ] 自动响度归一化</text>

      <!-- Row 5: More sliders and raw logs -->
