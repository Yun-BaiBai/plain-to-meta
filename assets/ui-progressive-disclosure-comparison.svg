      <text x="10" y="218" fill="#F87171" stroke="none">[WARN] FFmpeg thread_queue_size=512 deprecated | [DEBUG] Worker pool initialized=4</text>
      <text x="10" y="236" fill="#F87171" stroke="none">[ERROR] Null Reference in preset_id=null (未操作先弹一堆调试报错框)</text>

      <!-- Row 7: 5 competing buttons -->
      <rect x="0" y="262" width="95" height="30" rx="4" fill="#3F3F46"/><text x="18" y="281" fill="#E4E4E7" stroke="none">校验参数</text>
      <rect x="102" y="262" width="95" height="30" rx="4" fill="#3F3F46"/><text x="120" y="281" fill="#E4E4E7" stroke="none">保存草稿</text>
      <rect x="204" y="262" width="95" height="30" rx="4" fill="#3F3F46"/><text x="222" y="281" fill="#E4E4E7" stroke="none">预渲染音频</text>
      <rect x="306" y="262" width="95" height="30" rx="4" fill="#3F3F46"/><text x="324" y="281" fill="#E4E4E7" stroke="none">合成视频</text>
      <rect x="408" y="262" width="95" height="30" rx="4" fill="#3F3F46"/><text x="426" y="281" fill="#E4E4E7" stroke="none">清理缓存</text>
    </g>

    <!-- Bottom diagnosis banner -->
