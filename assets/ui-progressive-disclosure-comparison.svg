      <rect x="0" y="172" width="104" height="56" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.8"/>
      <text x="52" y="196" text-anchor="middle" fill="#E0E7FF" font-size="12" font-weight="700">🔥 科技快节奏</text>
      <text x="52" y="214" text-anchor="middle" fill="#818CF8" font-size="10">推荐默认</text>

      <rect x="113" y="172" width="104" height="56" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="165" y="196" text-anchor="middle" fill="#CBD5E1" font-size="12">📖 深度叙事</text>
      <text x="165" y="214" text-anchor="middle" fill="#64748B" font-size="10">沉稳男声</text>

      <rect x="226" y="172" width="104" height="56" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="278" y="196" text-anchor="middle" fill="#CBD5E1" font-size="12">🛍️ 种草带货</text>
      <text x="278" y="214" text-anchor="middle" fill="#64748B" font-size="10">活力女声</text>

      <!-- Step 3: Single Primary CTA -->
      <rect x="0" y="246" width="330" height="42" rx="8" fill="#10B981"/>
      <text x="165" y="272" text-anchor="middle" fill="#052E16" font-size="14" font-weight="800">🚀 立即生成高清视频 (Cmd + Enter)</text>

      <!-- Right Collapsible Drawer (20% Advanced Settings tucked away) -->
      <rect x="348" y="24" width="140" height="264" rx="8" fill="#090D16" stroke="#334155" stroke-width="1" stroke-dasharray="4 2"/>
      <text x="418" y="50" text-anchor="middle" fill="#A5B4FC" font-size="11.5" font-weight="700">⚙️ 高级微调抽屉</text>
      <text x="418" y="68" text-anchor="middle" fill="#64748B" font-size="10">(按需展开 · 默认折叠)</text>

      <rect x="360" y="84" width="116" height="28" rx="5" fill="#1E293B"/>
      <text x="370" y="102" fill="#94A3B8" font-size="10.5">▸ 语音与混响细调</text>

      <rect x="360" y="120" width="116" height="28" rx="5" fill="#1E293B"/>
      <text x="370" y="138" fill="#94A3B8" font-size="10.5">▸ 字幕描边与坐标</text>

      <rect x="360" y="156" width="116" height="28" rx="5" fill="#1E293B"/>
      <text x="370" y="174" fill="#94A3B8" font-size="10.5">▸ 编码码率与帧率</text>

      <rect x="360" y="192" width="116" height="28" rx="5" fill="#1E293B"/>
      <text x="370" y="210" fill="#94A3B8" font-size="10.5">▸ 水印与导出配置</text>

      <text x="418" y="255" text-anchor="middle" fill="#10B981" font-size="10.5">✓ 保留 100% 专业能力</text>
      <text x="418" y="272" text-anchor="middle" fill="#10B981" font-size="10.5">✓ 零首屏认知干扰</text>
