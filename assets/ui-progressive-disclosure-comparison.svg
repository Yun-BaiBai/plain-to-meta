      <rect x="170" y="166" width="165" height="28" rx="4"/><text x="178" y="184" fill="#A1A1AA" stroke="none">BGM 闪避增益 ──●──</text>
      <rect x="340" y="166" width="163" height="28" rx="4"/><text x="348" y="184" fill="#A1A1AA" stroke="none">画面锐化半径 ──●──</text>

