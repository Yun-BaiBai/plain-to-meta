        <text x="287" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">P99 Latency</text>
        <text x="287" y="52" fill="#10B981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">14ms</text>
        <rect x="287" y="68" width="60" height="16" rx="3" fill="#064E3B"/>
        <text x="317" y="80" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="9">Verified</text>

        <!-- Stat Card 3 (1 col) -->
        <rect x="401" y="0" width="114" height="96" rx="8" fill="url(#bentoCardBg)" stroke="#475569" stroke-width="0.8"/>
        <text x="412" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Tokens Saved</text>
        <text x="412" y="52" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="22" font-weight="800">-69%</text>
        <text x="412" y="80" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Hick's Law cut</text>
