  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="620" rx="18" fill="url(#mainBg)"/>
  <rect x="1" y="1" width="1198" height="618" rx="17" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Main Header -->
  <g transform="translate(600, 38)">
    <text text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">
      🎨 真实视觉对比 02：Vibe Coding 美学跃迁 —— 告别“无脑紫蓝渐变”，1 秒激活 30+ 顶尖设计流派
    </text>
    <text y="26" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13.5">
      大白话需求：“帮我用 Cursor / v0 写一个 AI 生产力工具主页，看起来要高级、炫酷、有科技感！”
    </text>
  </g>

  <!-- ==================== LEFT: BEFORE (Generic AI Default) ==================== -->
  <g transform="translate(40, 85)">
    <!-- Outer Container -->
    <rect width="525" height="505" rx="14" fill="#0D0914" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Window Bar -->
    <rect width="525" height="36" rx="14" fill="#1C1528"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="270" y="23" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">
      ❌ Before：大白话直出（AI 默认生成的千篇一律“审美死刑”）
    </text>

    <!-- Fake Website Content (The Dreaded AI Purple Gradient) -->
    <g transform="translate(16, 48)">
      <rect width="493" height="375" rx="8" fill="url(#genericPurple)"/>
      <rect width="493" height="375" rx="8" fill="url(#purpleGlow)"/>

