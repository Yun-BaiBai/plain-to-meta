        <circle cx="250" cy="55" r="3" fill="#38BDF8"/>
        <text x="215" y="86" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">+34.2%</text>

        <!-- Stat Card 2 (1 col) -->
