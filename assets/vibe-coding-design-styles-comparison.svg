      <g transform="translate(16, 36)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
        <text x="0" y="14" fill="#10B981">~/agy/plain-to-meta ❯</text>
        <text x="135" y="14" fill="#F8FAFC">agy compile --style="bento" --fsm=strict</text>

        <text x="0" y="34" fill="#64748B">[INFO] 2026-11-10T21:05:31Z Initializing Orient-Borrow-Ground runtime...</text>
        <text x="0" y="50" fill="#38BDF8">✔ [Borrow] Injected Meta Key: Bento Grid 4-track + Hick's Law threshold=16</text>
        <text x="0" y="66" fill="#34D399">✔ [Ground] Applied Tailwind: grid-cols-4 backdrop-blur-md border-white/10</text>
        <text x="0" y="82" fill="#FBBF24">❯ [Frontier] Q1: Need dark/light mode toggle? (Default: Dark native [Y/n]) _</text>
      </g>
    </g>
