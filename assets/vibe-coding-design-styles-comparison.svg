        <rect x="0" y="0" width="220" height="82" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2" style="filter: drop-shadow(4px 4px 0px #000000);"/>
        <text x="14" y="26" fill="#000000" font-family="system-ui, sans-serif" font-size="13" font-weight="800">NO FLUFF. JUST CODE.</text>
        <text x="14" y="46" fill="#4B5563" font-family="system-ui, sans-serif" font-size="10">Zero CSS bloat. Zero useless gradients.</text>
        <rect x="14" y="56" width="75" height="18" rx="2" fill="#86EFAC" stroke="#000000" stroke-width="1.5"/>
        <text x="51" y="69" text-anchor="middle" fill="#000000" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">100% RAW</text>

        <!-- Brutalist Card 2 (Yellow) -->
        <rect x="240" y="0" width="150" height="82" rx="4" fill="#FEF08A" stroke="#000000" stroke-width="2" style="filter: drop-shadow(4px 4px 0px #000000);"/>
        <text x="252" y="24" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="800">SHIP IN 10 MINS</text>
        <text x="252" y="44" fill="#000000" font-family="system-ui, sans-serif" font-size="9.5">Hard drop shadows hit</text>
        <text x="252" y="58" fill="#000000" font-family="system-ui, sans-serif" font-size="9.5">different on conversion.</text>

        <!-- Brutalist CTA Button -->
        <rect x="410" y="14" width="105" height="52" rx="4" fill="#F43F5E" stroke="#000000" stroke-width="2" style="filter: drop-shadow(4px 4px 0px #000000);"/>
        <text x="462" y="44" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="900">GET KEY →</text>
