        <text x="326" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Deep Insights</text>
        <text x="326" y="74" fill="#C084FC" font-family="system-ui, sans-serif" font-size="9.5">Advanced reasoning</text>
