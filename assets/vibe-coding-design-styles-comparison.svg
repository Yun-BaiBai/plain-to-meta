      <rect x="12" y="8" width="165" height="22" rx="4" fill="#FACC15" stroke="#000000" stroke-width="1.5"/>
      <text x="18" y="23" fill="#000000" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">
