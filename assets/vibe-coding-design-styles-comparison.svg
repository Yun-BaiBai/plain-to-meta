        <!-- Card 1 -->
        <rect x="0" y="0" width="144" height="110" rx="10" fill="#2E1065" fill-opacity="0.5" stroke="#9333EA" stroke-width="1"/>
        <circle cx="25" cy="25" r="12" fill="#9333EA" fill-opacity="0.4"/>
        <text x="25" y="30" text-anchor="middle" fill="#E9D5FF" font-size="13">⚡</text>
        <text x="14" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Real-Time Fast</text>
        <text x="14" y="74" fill="#C084FC" font-family="system-ui, sans-serif" font-size="9.5">Blazing speed for your</text>
        <text x="14" y="87" fill="#C084FC" font-family="system-ui, sans-serif" font-size="9.5">daily generative tasks.</text>

        <!-- Card 2 -->
        <rect x="156" y="0" width="144" height="110" rx="10" fill="#2E1065" fill-opacity="0.5" stroke="#9333EA" stroke-width="1"/>
        <circle cx="181" cy="25" r="12" fill="#9333EA" fill-opacity="0.4"/>
        <text x="181" y="30" text-anchor="middle" fill="#E9D5FF" font-size="13">🔒</text>
        <text x="170" y="58" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Enterprise Safe</text>
        <text x="170" y="74" fill="#C084FC" font-family="system-ui, sans-serif" font-size="9.5">End to end encryption</text>
        <text x="170" y="87" fill="#C084FC" font-family="system-ui, sans-serif" font-size="9.5">for all data vectors.</text>

